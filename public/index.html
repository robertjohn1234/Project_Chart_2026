<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PH PERTAMA ISTC | Home</title>
  <meta name="description" content="PH PERTAMA ISTC project dashboard home: bulletin board, daily verse and project at a glance.">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/home.css">
</head>
<body class="home">
  <div id="site-header"></div>
  <script src="/nav.js"></script>

  <main class="page-shell">
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-kicker" id="heroDate"></div>
      <h1 class="hero-title" id="heroTitle">Welcome</h1>
      <p class="hero-sub">Welcome to the PH PERTAMA ISTC project dashboard. Merry Christmas to the whole team!</p>
      <span class="xmas-chip" id="xmasChip" hidden></span>
    </section>

    <section class="home-grid">
      <div>
        <h2 class="section-title">Company bulletin board</h2>
        <div class="carousel" id="carousel" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Company bulletin board">
          <div class="carousel-viewport">
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="carousel-btn prev" id="prevBtn" type="button" aria-label="Previous announcement" hidden>&#8249;</button>
            <button class="carousel-btn next" id="nextBtn" type="button" aria-label="Next announcement" hidden>&#8250;</button>
          </div>
          <div class="carousel-bar" id="carouselBar" hidden>
            <div class="carousel-dots" id="carouselDots"></div>
            <div class="carousel-count" id="carouselCount"></div>
          </div>
        </div>
      </div>

      <div>
        <h2 class="section-title">Verse for today</h2>
        <div class="verse-card">
          <blockquote class="verse-text" id="verseText">Loading...</blockquote>
          <div>
            <div class="verse-ref" id="verseRef"></div>
            <button class="verse-btn" id="verseBtn" type="button">Show another verse</button>
          </div>
        </div>
      </div>
    </section>

    <h2 class="section-title">Project at a glance</h2>
    <section class="glance" id="glance"></section>

    <footer class="footer">PH PERTAMA · Internal Project Dashboard</footer>
  </main>

  <script src="/home.js"></script>
</body>
</html>
