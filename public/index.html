
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cable Installation Dashboard</title>
  <script src="/vendor/chart.umd.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #1e293b;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    h1 { margin: 0 0 8px; font-size: 27px; }
    h2 { font-size: 18px; margin: 0 0 18px; }
    .muted { color: #64748b; font-size: 13px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card, .panel {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px #0f172a0a;
      min-width: 0;
    }

    .card-label { color: #64748b; font-size: 14px; }
    .card-value { font-size: 30px; font-weight: bold; margin-top: 12px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .chart-area { height: 390px; position: relative; }
    .trend-area { height: 360px; position: relative; }
    .table-wrap { overflow-x: auto; }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
      white-space: nowrap;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th { background: #f8fafc; }
    .section-row td {
      background: #eaf0f8;
      font-weight: bold;
    }

    .positive { color: #15803d; }
    .negative { color: #b91c1c; }
    .zero { color: #64748b; }

    button {
      border: 0;
      padding: 10px 15px;
      border-radius: 7px;
      background: #1d4ed8;
      color: white;
      cursor: pointer;
    }

    #status { margin-top: 18px; font-size: 13px; color: #64748b; }

    @media (max-width: 850px) {
      body { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .chart-area { height: 420px; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>Cable Pulling &amp; Termination</h1>
      <div class="muted" id="reportDate">Loading reporting date...</div>
    </div>
    <button id="refreshButton">Refresh Data</button>
  </header>

  <section class="cards" id="summaryCards"></section>

  <section class="grid">
    <div class="panel">
      <h2>Latest Progress by Area</h2>
      <div class="chart-area">
        <canvas id="areaChart"></canvas>
      </div>
    </div>

    <div class="panel">
      <h2>Weekly Progress Trend</h2>
      <label class="muted" for="areaSelect">Select installation area</label>
      <select id="areaSelect" style="max-width:100%; margin:8px 0 14px; padding:8px;"></select>
      <div class="trend-area">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Detailed Weekly Progress</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Section</th>
            <th>Installation Area</th>
            <th>Previous Week</th>
            <th>Latest Week</th>
            <th>Change</th>
          </tr>
        </thead>
        <tbody id="progressTable"></tbody>
      </table>
    </div>
  </section>

  <p id="status">Connecting to the Excel workbook...</p>

<script>
  let dashboardData = null;
  let areaChart = null;
  let trendChart = null;

  const sectionColors = {
    "MV": "#2563eb",
    "LV": "#0d9488",
    "ELV & Automation": "#7c3aed"
  };

  const percent = value =>
    value === null || value === undefined
      ? "—"
      : (value * 100).toFixed(1) + "%";

  const shortDate = value => {
    const [year, month, day] = value.split("-");
    return `${month}/${day}/${year}`;
  };

  function renderCards(summary) {
    const container = document.getElementById("summaryCards");
    container.replaceChildren();

    summary.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      const label = document.createElement("div");
      label.className = "card-label";
      label.textContent = item.section + " Average";

      const value = document.createElement("div");
      value.className = "card-value";
      value.textContent = percent(item.average);

      card.append(label, value);
      container.appendChild(card);
    });
  }

  function renderAreaChart(data) {
    const validAreas = data.areas.filter(
      item => item.latest !== null
    );

    if (areaChart) areaChart.destroy();

    areaChart = new Chart(document.getElementById("areaChart"), {
      type: "bar",
      data: {
        labels: validAreas.map(
          item => `${item.section} | ${item.area}`
        ),
        datasets: [{
          label: "Latest Progress",
          data: validAreas.map(item => item.latest * 100),
          backgroundColor: validAreas.map(
            item => sectionColors[item.section] || "#64748b"
          ),
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: "y",
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: context => context.raw.toFixed(1) + "%"
            }
          }
        },
        scales: {
          x: {
            min: 0,
            max: 100,
            ticks: { callback: value => value + "%" }
          },
          y: {
            ticks: { font: { size: 11 } }
          }
        }
      }
    });
  }

  function renderAreaSelector(data) {
    const select = document.getElementById("areaSelect");
    const oldValue = select.value;
    select.replaceChildren();

    data.areas.forEach((item, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = `${item.section} | ${item.area}`;
      select.appendChild(option);
    });

    if (oldValue !== "" && Number(oldValue) < data.areas.length) {
      select.value = oldValue;
    } else {
      const preferred = data.areas.findIndex(
        item => item.section === "LV" && item.area.includes("RML")
      );
      select.value = String(preferred >= 0 ? preferred : 0);
    }
  }

  function renderTrendChart(data) {
    const selectedIndex = Number(
      document.getElementById("areaSelect").value
    );
    const item = data.areas[selectedIndex];
    if (!item) return;

    if (trendChart) trendChart.destroy();

    trendChart = new Chart(document.getElementById("trendChart"), {
      type: "line",
      data: {
        labels: data.weeks.map(shortDate),
        datasets: [{
          label: `${item.section} | ${item.area}`,
          data: item.progress.map(
            value => value === null ? null : value * 100
          ),
          borderColor: sectionColors[item.section] || "#2563eb",
          backgroundColor: sectionColors[item.section] || "#2563eb",
          borderWidth: 3,
          pointRadius: 4,
          tension: 0.2,
          spanGaps: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: "bottom" }
        },
        scales: {
          y: {
            min: 0,
            max: 100,
            ticks: { callback: value => value + "%" }
          }
        }
      }
    });
  }

  function renderTable(data) {
    const body = document.getElementById("progressTable");
    body.replaceChildren();
    let lastSection = "";

    data.areas.forEach(item => {
      if (item.section !== lastSection) {
        lastSection = item.section;
        const row = body.insertRow();
        row.className = "section-row";
        const cell = row.insertCell();
        cell.colSpan = 5;
        cell.textContent = item.section;
      }

      const row = body.insertRow();
      row.insertCell().textContent = item.section;
      row.insertCell().textContent = item.area;
      row.insertCell().textContent = percent(item.previous);
      row.insertCell().textContent = percent(item.latest);

      const changeCell = row.insertCell();
      if (item.change === null) {
        changeCell.textContent = "—";
      } else {
        const change = item.change;
        const sign = change > 0 ? "+" : "";
        changeCell.textContent = sign + change.toFixed(1) + " pp";
        changeCell.className =
          change > 0 ? "positive" :
          change < 0 ? "negative" : "zero";
      }
    });
  }

  async function refreshDashboard() {
    const status = document.getElementById("status");

    try {
      status.textContent = "Reading Excel workbook...";

      const response = await fetch("/api/data", { cache: "no-store" });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Failed to read Excel data.");
      }

      dashboardData = data;

      document.getElementById("reportDate").textContent =
        "Latest reporting week: " + shortDate(data.latestDate);

      renderCards(data.summary);
      renderAreaChart(data);
      renderAreaSelector(data);
      renderTrendChart(data);
      renderTable(data);

      status.textContent =
        "Connected | Last refreshed: " +
        new Date().toLocaleTimeString();
    } catch (error) {
      status.textContent = "Error: " + error.message;
    }
  }

  document.getElementById("refreshButton")
    .addEventListener("click", refreshDashboard);

  document.getElementById("areaSelect")
    .addEventListener("change", () => {
      if (dashboardData) renderTrendChart(dashboardData);
    });

  refreshDashboard();
  setInterval(refreshDashboard, 10000);
</script>
</body>
</html>
