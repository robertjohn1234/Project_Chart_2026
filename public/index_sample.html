
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Excel Dashboard</title>

  <script src="/vendor/chart.umd.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #202938;
    }

    h1 { margin-bottom: 5px; }

    .subtitle {
      color: #687385;
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card, .chart-box {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0000000a;
    }

    .card h3 {
      margin: 0 0 12px;
      color: #687385;
      font-size: 14px;
    }

    .value {
      font-size: 27px;
      font-weight: bold;
    }

    .chart-box { height: 360px; }

    #status {
      margin-top: 15px;
      color: #687385;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      body { padding: 16px; }
      .cards { grid-template-columns: 1fr; }
      .chart-box { height: 300px; }
    }
  </style>
</head>

<body>
  <h1>Sample Dashboard</h1>
  <p class="subtitle">Monthly Sales and Expenses — Excel Data</p>

  <section class="cards">
    <div class="card">
      <h3>Total Sales</h3>
      <div class="value" id="sales">Loading...</div>
    </div>

    <div class="card">
      <h3>Total Expenses</h3>
      <div class="value" id="expenses">Loading...</div>
    </div>

    <div class="card">
      <h3>Net Amount</h3>
      <div class="value" id="net">Loading...</div>
    </div>
  </section>

  <div class="chart-box">
    <canvas id="salesChart"></canvas>
  </div>

  <p id="status">Connecting to Excel data...</p>

  <script>
    const money = value =>
      new Intl.NumberFormat("en-PH", {
        style: "currency",
        currency: "PHP",
        maximumFractionDigits: 0
      }).format(value);

    const chart = new Chart(
      document.getElementById("salesChart"),
      {
        type: "bar",
        data: {
          labels: [],
          datasets: [
            {
              label: "Sales",
              data: [],
              backgroundColor: "#377dff"
            },
            {
              label: "Expenses",
              data: [],
              backgroundColor: "#f59e0b"
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            intersect: false,
            mode: "index"
          },
          plugins: {
            title: {
              display: true,
              text: "Monthly Sales vs. Expenses"
            },
            tooltip: {
              callbacks: {
                label: context =>
                  `${context.dataset.label}: ${money(context.raw)}`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: value => "₱" + value.toLocaleString()
              }
            }
          }
        }
      }
    );

    async function refreshDashboard() {
      try {
        const response = await fetch("/api/data");

        if (!response.ok) {
          throw new Error("Could not load Excel data");
        }

        const data = await response.json();

        const totalSales = data.reduce((sum, row) => sum + row.sales, 0);
        const totalExpenses = data.reduce(
          (sum, row) => sum + row.expenses, 0
        );

        document.getElementById("sales").textContent = money(totalSales);
        document.getElementById("expenses").textContent =
          money(totalExpenses);
        document.getElementById("net").textContent =
          money(totalSales - totalExpenses);

        chart.data.labels = data.map(row => row.month);
        chart.data.datasets[0].data = data.map(row => row.sales);
        chart.data.datasets[1].data = data.map(row => row.expenses);
        chart.update();

        document.getElementById("status").textContent =
          "Connected | Last refreshed: " + new Date().toLocaleTimeString();
      } catch (error) {
        document.getElementById("status").textContent =
          "Error: " + error.message;
      }
    }

    refreshDashboard();
    setInterval(refreshDashboard, 5000);
  </script>
</body>
</html>
